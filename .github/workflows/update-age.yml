name: Update age

on:
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:

jobs:
  update-age:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Update age in README
        run: |
          BIRTH_DATE="2003-09-03"
          TODAY=$(date -u +%Y-%m-%d)

          AGE=$(( $(date -u -d "$TODAY" +%Y) - $(date -u -d "$BIRTH_DATE" +%Y) ))
          if [ "$(date -u -d "$TODAY" +%m%d)" -lt "$(date -u -d "$BIRTH_DATE" +%m%d)" ]; then
            AGE=$((AGE - 1))
          fi

          sed -i -E "s/[0-9]+-year-old/${AGE}-year-old/" README.md

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet README.md || (git add README.md && git commit -m "chore: update age" && git push)
